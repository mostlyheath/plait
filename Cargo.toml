[workspace]
members = ["crates/plait", "crates/plait-core", "crates/plait-engine", "crates/plait-protocol", "crates/plait-host", "crates/plait-interop-tests"]
default-members = ["crates/plait"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/heath0xFF/plait"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14", default-features = false, features = ["font-kit"] }
# Snapshot tests only; each supplies real text shaping for the headless renderer.
# gpui_apple is Core Text on macOS and gpui_wgpu is cosmic-text on Linux.
gpui_apple = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14", default-features = false }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14", default-features = false }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
