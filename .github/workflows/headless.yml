name: Linux headless development

# The Linux check gates a merge with the macOS tests; it does not run again on main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Check installer planning
        run: python3 -m unittest discover -s scripts -p 'test_release_*.py'
      - name: Check the Linux host installer
        run: python3 -m unittest discover -s scripts -p 'test_install_*.py'
      - name: Check Rust and runtime without Linux command execution
        run: bash scripts/check.sh
      - name: Check installed runtime layout
        if: github.event_name == 'pull_request'
        run: bash scripts/check-installed-changes.sh HEAD^1
