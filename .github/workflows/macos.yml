name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Build main and publish the next preview
        type: boolean
        default: false

permissions:
  contents: read

# A run on main always finishes: a newer push waits behind the running one
# rather than cancelling it, and GitHub keeps only the newest waiting one, which
# holds every change before it. A release has a group of its own, so a merge
# that arrives while it waits cannot take its place. Pull requests cancel
# superseded runs.
concurrency:
  group: macos-${{ github.ref }}${{ inputs.release && '-release' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A change is tested on its pull request and again when it reaches main,
  # since a request need not be up to date with main to merge, unless the
  # request's check already passed on the exact tree main now holds. Nothing
  # is released by a merge: a person starts a release by hand, on main. This
  # job decides which of these this run is, and for a release whether main
  # holds unreleased code that ships and which preview that makes.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      test: ${{ steps.decide.outputs.test }}
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      reused: ${{ steps.reuse.outputs.reused }}
      reused_run: ${{ steps.reuse.outputs.reused_run }}
      tree: ${{ steps.tree.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every tag and the pull request's base are needed to compare against.
          fetch-depth: 0
      - id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch && $RELEASE == true && $GITHUB_REF != refs/heads/main ]]; then
            echo '::error::A release is made from main.'
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            pull_request) python3 scripts/release_plan.py pull-request "$BASE" ;;
            push) python3 scripts/release_plan.py merged "$BEFORE" ;;
            # A run started by hand releases main when asked to, and otherwise
            # tests the branch it was started on.
            *)
              if [[ $RELEASE == true ]]; then
                python3 scripts/release_plan.py main
              else
                printf 'test=true\nrelease=false\n'
              fi
              ;;
          esac | tee -a "$GITHUB_OUTPUT"
      # A preview ships with its changelog: refuse a release whose tag has no
      # section, before anything is built.
      - name: Require release notes
        if: steps.decide.outputs.release == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: python3 scripts/changelog.py section "$TAG" > /dev/null
      # A merge whose exact tree passed the check on its pull request is not
      # tested again. The script prints reused=false on any doubt, and anything
      # but reused=true runs the full check.
      - id: reuse
        if: github.event_name == 'push' && steps.decide.outputs.test == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/release_reuse.py "$GITHUB_SHA" "$BEFORE" | tee -a "$GITHUB_OUTPUT"
      # The tree this run tests; a passing pull request records it for the merge.
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" | tee -a "$GITHUB_OUTPUT"

  # The tests that gate a merge, in two halves that run side by side. They run
  # on the pull request, and again on main after the merge, where they see
  # every merged change together, unless the plan reuses the request's result.
  check-rust:
    needs: plan
    if: needs.plan.outputs.test == 'true' && needs.plan.outputs.reused != 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      # The release binaries are built and tested once, by the package job on main.
      PLAIT_CHECK_SKIP_RELEASE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tools
        uses: ./.github/actions/macos-tools
      - name: Install iOS target
        run: rustup target add aarch64-apple-ios
      - name: Restore native build cache
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/aarch64-apple-ios/debug
          key: macos26-${{ runner.arch }}-${{ steps.tools.outputs.cache-id }}-check-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            macos26-${{ runner.arch }}-${{ steps.tools.outputs.cache-id }}-check-v2-
            macos26-${{ runner.arch }}-${{ steps.tools.outputs.cache-id }}-check-
      - name: Check Rust workspace
        run: bash scripts/check.sh rust --require-command-sandbox
      - name: Check installer planning
        run: python3 -m unittest discover -s scripts -p 'test_release_*.py'

  check-runtime:
    needs: plan
    if: needs.plan.outputs.test == 'true' && needs.plan.outputs.reused != 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
      - id: tools
        uses: ./.github/actions/macos-tools
      - name: Restore native build cache
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/aarch64-apple-ios/debug
          key: macos26-${{ runner.arch }}-${{ steps.tools.outputs.cache-id }}-check-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            macos26-${{ runner.arch }}-${{ steps.tools.outputs.cache-id }}-check-v2-
            macos26-${{ runner.arch }}-${{ steps.tools.outputs.cache-id }}-check-
      - name: Check runtime and real command sandbox
        run: bash scripts/check.sh runtime --require-command-sandbox
      - name: Check installed runtime layout on a fresh main check
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: bash scripts/check-installed-changes.sh "$BEFORE"
      - name: Check runtime recovery without credentials
        working-directory: experiments/pi-durable
        run: |
          npm ci --ignore-scripts
          npm test

  # The required check. It keeps the name branch protection asks for and
  # passes only when both halves passed, there was nothing to test, or the
  # plan reused the pull request's passing result for this exact tree. A
  # skipped, cancelled or failed half fails it.
  check:
    needs: [plan, check-rust, check-runtime]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both halves
        env:
          PLAN: ${{ needs.plan.result }}
          TEST: ${{ needs.plan.outputs.test }}
          REUSED: ${{ needs.plan.outputs.reused }}
          REUSED_RUN: ${{ needs.plan.outputs.reused_run }}
          RUST: ${{ needs.check-rust.result }}
          RUNTIME: ${{ needs.check-runtime.result }}
        run: |
          if [[ $PLAN != success ]]; then
            echo "::error::The plan did not succeed ($PLAN)."
            exit 1
          fi
          if [[ $TEST != true ]]; then
            echo 'Nothing in this change needs the tests.'
            exit 0
          fi
          if [[ $REUSED == true ]]; then
            echo "::notice::This tree passed the check on its pull request: $REUSED_RUN"
            exit 0
          fi
          if [[ $RUST != success || $RUNTIME != success ]]; then
            echo "::error::Rust check: $RUST. Runtime check: $RUNTIME."
            exit 1
          fi
      - name: Record the tested tree
        if: github.event_name == 'pull_request' && needs.plan.outputs.test == 'true'
        env:
          TREE: ${{ needs.plan.outputs.tree }}
        run: |
          test -n "$TREE"
          printf '%s\n' "$TREE" > tested-tree
      - name: Upload the tested tree
        if: github.event_name == 'pull_request' && needs.plan.outputs.test == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree
          path: tested-tree
          if-no-files-found: error
          retention-days: 30

  # A pull request can read a build cache only if main saved it. When the
  # lockfile or toolchain changes, main builds everything the check builds
  # once (test binaries, lints, the no-default-features and iOS checks, and
  # the host) and saves it for the pull requests that follow.
  test-cache:
    needs: plan
    # After a merge that is tested or reused, and with a release.
    if: (github.event_name == 'push' && needs.plan.outputs.test == 'true') || needs.plan.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tools
        uses: ./.github/actions/macos-tools
      - name: Look for this lockfile's test cache
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/aarch64-apple-ios/debug
          key: macos26-${{ runner.arch }}-${{ steps.tools.outputs.cache-id }}-check-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          lookup-only: true
      - name: Build what the check builds
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: |
          rustup target add aarch64-apple-ios
          cargo test --locked --workspace --no-run
          cargo clippy --locked --workspace --all-targets
          cargo check --locked -p plait-client --no-default-features
          cargo check --locked -p plait-client --no-default-features --target aarch64-apple-ios
          cargo build --locked -p plait-host
      - name: Save native build cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/aarch64-apple-ios/debug
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The one build of a release: installers, the installer test, and the
  # package the real-window check and the publish job both use.
  package:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 65
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      PLAIT_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tools
        uses: ./.github/actions/macos-tools
      - name: Restore native build cache
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/build-tools
            target/release-inputs
          key: macos26-${{ runner.arch }}-${{ steps.tools.outputs.cache-id }}-package-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: macos26-${{ runner.arch }}-${{ steps.tools.outputs.cache-id }}-package-
      # The installed-app test runs the checkout's runtime tests against the installed runtime.
      - name: Install runtime test dependencies
        working-directory: runtime
        run: npm ci --ignore-scripts --omit=optional
      - name: Build and verify client and host installers
        run: bash scripts/build-macos.sh
      - name: Install and test packaged client and daemon
        run: bash scripts/smoke-installer-macos.sh
      - name: Upload development package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plait-macos-arm64-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/install.sh
            dist/release.json
            dist/*.sha256
            dist/*.pkg
            dist/Plait-Release-*.json
            dist/installed-client*.png
            dist/installed-client.log
          if-no-files-found: error
          retention-days: 14
      - name: Save native build cache
        if: always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/build-tools
            target/release-inputs
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Packaged on pull requests too, so a broken Linux archive fails before a release.
  linux-host:
    needs: plan
    if: needs.plan.outputs.release == 'true' || (needs.plan.outputs.test == 'true' && needs.plan.outputs.reused != 'true')
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and package host
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          rustup toolchain install --profile minimal --no-self-update
          python3 scripts/package_linux_host.py --arch ${{ matrix.arch }} --out dist --release-tag "$RELEASE_TAG"
          python3 scripts/smoke_linux_host.py dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plait-host-linux-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  # The real-window check drives the package this run built. It is advisory:
  # publishing does not wait for it, and its failures do not fail the run.
  acceptance:
    needs: package
    runs-on: macos-26
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARTIFACT: plait-macos-arm64-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/macos-tools
      - name: Download the package this run built
        run: gh run download "$GITHUB_RUN_ID" -n "$ARTIFACT" -D dist
      - name: Native acceptance (advisory)
        id: native-acceptance
        env:
          # The virtual display can stall presentation and AX updates until a capture forces a frame.
          PLAIT_ACCEPTANCE_FORCE_FRAMES: '1'
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -o pipefail
          {
            mkdir -p acceptance-build/host
            ditto -x -k dist/Plait-*-macos-arm64.zip acceptance-build
            tar -xzf acceptance-build/Plait.app/Contents/Resources/Host.tar.gz -C acceptance-build/host
            host=(acceptance-build/host/*/bin/plait-host)
            bash scripts/acceptance-macos.sh \
              --app acceptance-build/Plait.app/Contents/MacOS/plait \
              --host "${host[0]}" --artifacts acceptance-results
          } 2>&1 | tee acceptance-output.log
      - name: Upload native observations and failure captures
        if: always() && steps.native-acceptance.outcome != 'skipped'
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plait-native-acceptance-${{ github.sha }}
          path: |
            acceptance-output.log
            acceptance-results/
          if-no-files-found: warn
          retention-days: 14

  # The preview's number is taken only here, when everything before it passed:
  # a build that fails uses up no number and leaves no tag behind.
  publish:
    needs: [plan, package, linux-host]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      ARTIFACT: plait-macos-arm64-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the tested build and verify every checksum
        run: |
          gh run download "$GITHUB_RUN_ID" -n "$ARTIFACT" -D release
          gh run download "$GITHUB_RUN_ID" -n "plait-host-linux-x86_64-$GITHUB_SHA" -D release
          gh run download "$GITHUB_RUN_ID" -n "plait-host-linux-arm64-$GITHUB_SHA" -D release
          (cd release && sha256sum -c ./*.sha256)
      - name: Build the update signing tool
        run: |
          rustup toolchain install --profile minimal --no-self-update
          cargo build --locked -p plait-protocol --example update-key
      - name: Write and sign the update manifest
        env:
          PLAIT_UPDATE_SIGNING_KEY: ${{ secrets.PLAIT_UPDATE_SIGNING_KEY }}
        run: |
          test -n "$PLAIT_UPDATE_SIGNING_KEY" || { echo 'PLAIT_UPDATE_SIGNING_KEY is not set' >&2; exit 1; }
          python3 scripts/update_manifest.py release "$RELEASE_TAG"
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$PLAIT_UPDATE_SIGNING_KEY" > "$key"
          # Signing refuses a key that does not match the one built into Plait.
          # Schema 1 for current apps, and one manifest per component for the
          # independent updates in docs/RELEASING.md. Each is checked as a client would.
          for manifest in release/update.json release/update-client.json release/update-host.json release/update-host-linux-*.json; do
            test -f "$manifest" || continue
            target/debug/examples/update-key sign "$key" "$manifest"
            target/debug/examples/update-key verify "$manifest"
          done
      - name: Publish an immutable preview
        run: |
          # What changed comes first; GitHub appends its list of pull requests.
          { echo "## What's new"; echo; python3 scripts/changelog.py section "$RELEASE_TAG"; echo; } > notes.md
          printf '%s\n' \
            '## Install' \
            'Download the DMG, open it, and drag **Plait** into **Applications**, then open it from there.' \
            'On first launch Plait sets up its local server for your user account. No Xcode, Rust, Node, or Terminal command is needed.' \
            '' \
            '**Unsigned local preview. Not notarized. Do not disable Gatekeeper.**' \
            'Apple Silicon; macOS 15+ declared, tested on macOS 26.' \
            '' \
            'The host includes Node and the runtime. Model credentials and project build tools are not included.' \
            'Per-user installs update from **Plait → Check for Updates…**; headless hosts run `plait-host update`.' \
            'The first open needs **System Settings → Privacy & Security → Open Anyway**, once.' \
            'An earlier system-wide package install moves once with the Terminal command in the README; it needs administrator access once. Threads, drafts, and credentials are preserved.' \
            '' \
            'Native code display, copy controls, saved drafts, and safe submission recovery are included.' \
            'The installed coding/reconnect test uses a scripted provider and real sandboxed Cargo commands, not a live model.' \
            '' \
            'The attached installed-client images show that labeled test, not a personal-account session.' \
            'Linux hosts (x86_64, arm64): Plait-Host-*-linux-*.tar.gz, each with its own signed update-host-linux-*.json. See docs/REMOTE.md.' \
            'See docs/GUIDE.md, docs/REMOTE.md, and docs/VERIFICATION.md at this tag for setup and limits.' >> notes.md
          # The tag is created with the release, on the commit this run built.
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease --draft \
            --title "Plait $RELEASE_TAG — local preview" --notes-file notes.md --generate-notes \
            release/*.dmg release/*.pkg release/*.zip release/*.tar.gz release/*.sha256 \
            release/update*.json release/update*.json.sig \
            release/install.sh release/release.json release/Plait-Release-*.json release/installed-client*.png
          gh release edit "$RELEASE_TAG" --draft=false
