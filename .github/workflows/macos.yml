name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A build on main always finishes: a newer push waits behind the running build
# rather than cancelling it, and GitHub keeps only the newest waiting one, which
# holds every change before it. Pull requests cancel superseded runs.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A change is tested once, on its pull request, and built once, when it
  # reaches main. This job decides which of the two this run is, and for main
  # whether it holds unreleased code that ships and which preview that makes.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      test: ${{ steps.decide.outputs.test }}
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every tag and the pull request's base are needed to compare against.
          fetch-depth: 0
      - id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) python3 scripts/release_plan.py pull-request "$BASE" ;;
            push) python3 scripts/release_plan.py main ;;
            # A run started by hand tests the branch it was started on.
            *) printf 'test=true\nrelease=false\n' ;;
          esac | tee -a "$GITHUB_OUTPUT"

  # The tests that gate a merge. They run on the pull request, not again on main.
  check:
    needs: plan
    if: needs.plan.outputs.test == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      # The release binaries are built and tested once, by the package job on main.
      PLAIT_CHECK_SKIP_RELEASE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tools
        uses: ./.github/actions/macos-tools
      - name: Install iOS target
        run: rustup target add aarch64-apple-ios
      - name: Restore native build cache
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: macos26-${{ runner.arch }}-${{ steps.tools.outputs.cache-id }}-check-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: macos26-${{ runner.arch }}-${{ steps.tools.outputs.cache-id }}-check-
      - name: Check workspace and real command sandbox
        run: bash scripts/check.sh --require-command-sandbox
      - name: Check runtime recovery without credentials
        working-directory: experiments/pi-durable
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Check installer planning
        run: python3 -m unittest discover -s scripts -p 'test_release_*.py'

  # A pull request can read a build cache only if main saved it, and the tests
  # no longer run on main. When the lockfile or toolchain changes, main builds
  # the test binaries once and saves them for the pull requests that follow.
  test-cache:
    needs: plan
    # A lockfile or toolchain change always ships, so it always makes a release.
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tools
        uses: ./.github/actions/macos-tools
      - name: Look for this lockfile's test cache
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: macos26-${{ runner.arch }}-${{ steps.tools.outputs.cache-id }}-check-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          lookup-only: true
      - name: Build the test binaries
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo test --locked --workspace --no-run
      - name: Save native build cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The one build of a release: installers, the installer test, and the
  # package the real-window check and the publish job both use.
  package:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      PLAIT_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tools
        uses: ./.github/actions/macos-tools
      - name: Restore native build cache
        id: cargo-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/build-tools
            target/release-inputs
          key: macos26-${{ runner.arch }}-${{ steps.tools.outputs.cache-id }}-package-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: macos26-${{ runner.arch }}-${{ steps.tools.outputs.cache-id }}-package-
      # The installed-app test runs the checkout's runtime tests against the installed runtime.
      - name: Install runtime test dependencies
        working-directory: runtime
        run: npm ci --ignore-scripts --omit=optional
      - name: Build and verify client and host installers
        run: bash scripts/build-macos.sh
      - name: Install and test packaged client and daemon
        run: bash scripts/smoke-installer-macos.sh
      - name: Upload development package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plait-macos-arm64-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/install.sh
            dist/release.json
            dist/*.sha256
            dist/*.pkg
            dist/Plait-Release-*.json
            dist/installed-client*.png
            dist/installed-client.log
          if-no-files-found: error
          retention-days: 14
      - name: Save native build cache
        if: always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/build-tools
            target/release-inputs
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Packaged on pull requests too, so a broken Linux archive fails before a release.
  linux-host:
    needs: plan
    if: needs.plan.outputs.release == 'true' || needs.plan.outputs.test == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and package host
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          rustup toolchain install --profile minimal --no-self-update
          python3 scripts/package_linux_host.py --arch ${{ matrix.arch }} --out dist --release-tag "$RELEASE_TAG"
          python3 scripts/smoke_linux_host.py dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plait-host-linux-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  # The real-window check drives the package this run built. It is advisory:
  # publishing does not wait for it, and its failures do not fail the run.
  acceptance:
    needs: package
    runs-on: macos-26
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARTIFACT: plait-macos-arm64-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/macos-tools
      - name: Download the package this run built
        run: gh run download "$GITHUB_RUN_ID" -n "$ARTIFACT" -D dist
      - name: Native acceptance (advisory)
        id: native-acceptance
        env:
          # The virtual display can stall presentation and AX updates until a capture forces a frame.
          PLAIT_ACCEPTANCE_FORCE_FRAMES: '1'
        timeout-minutes: 8
        continue-on-error: true
        run: |
          set -o pipefail
          {
            mkdir -p acceptance-build/host
            ditto -x -k dist/Plait-*-macos-arm64.zip acceptance-build
            tar -xzf acceptance-build/Plait.app/Contents/Resources/Host.tar.gz -C acceptance-build/host
            host=(acceptance-build/host/*/bin/plait-host)
            bash scripts/acceptance-macos.sh \
              --app acceptance-build/Plait.app/Contents/MacOS/plait \
              --host "${host[0]}" --artifacts acceptance-results
          } 2>&1 | tee acceptance-output.log
      - name: Upload native observations and failure captures
        if: always() && steps.native-acceptance.outcome != 'skipped'
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plait-native-acceptance-${{ github.sha }}
          path: |
            acceptance-output.log
            acceptance-results/
          if-no-files-found: warn
          retention-days: 14

  # The preview's number is taken only here, when everything before it passed:
  # a build that fails uses up no number and leaves no tag behind.
  publish:
    needs: [plan, package, linux-host]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      ARTIFACT: plait-macos-arm64-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the tested build and verify every checksum
        run: |
          gh run download "$GITHUB_RUN_ID" -n "$ARTIFACT" -D release
          gh run download "$GITHUB_RUN_ID" -n "plait-host-linux-x86_64-$GITHUB_SHA" -D release
          gh run download "$GITHUB_RUN_ID" -n "plait-host-linux-arm64-$GITHUB_SHA" -D release
          (cd release && sha256sum -c ./*.sha256)
      - name: Build the update signing tool
        run: |
          rustup toolchain install --profile minimal --no-self-update
          cargo build --locked -p plait-protocol --example update-key
      - name: Write and sign the update manifest
        env:
          PLAIT_UPDATE_SIGNING_KEY: ${{ secrets.PLAIT_UPDATE_SIGNING_KEY }}
        run: |
          test -n "$PLAIT_UPDATE_SIGNING_KEY" || { echo 'PLAIT_UPDATE_SIGNING_KEY is not set' >&2; exit 1; }
          python3 scripts/update_manifest.py release "$RELEASE_TAG"
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$PLAIT_UPDATE_SIGNING_KEY" > "$key"
          # Signing refuses a key that does not match the one built into Plait.
          # Schema 1 for current apps, and one manifest per component for the
          # independent updates in docs/RELEASING.md. Each is checked as a client would.
          for manifest in release/update.json release/update-client.json release/update-host.json release/update-host-linux-*.json; do
            test -f "$manifest" || continue
            target/debug/examples/update-key sign "$key" "$manifest"
            target/debug/examples/update-key verify "$manifest"
          done
      - name: Publish an immutable preview
        run: |
          printf '%s\n' \
            '## Install' \
            'Download the DMG, open it, and drag **Plait** into **Applications**, then open it from there.' \
            'On first launch Plait sets up its local server for your user account. No Xcode, Rust, Node, or Terminal command is needed.' \
            '' \
            '**Unsigned local preview. Not notarized. Do not disable Gatekeeper.**' \
            'Apple Silicon; macOS 15+ declared, tested on macOS 26.' \
            '' \
            'The host includes Node and the runtime. Model credentials and project build tools are not included.' \
            'Per-user installs update from **Plait → Check for Updates…**; headless hosts run `plait-host update`.' \
            'An earlier system-wide package install moves once with **Move from system-wide install.command** on the DMG; it needs administrator access once. Threads, drafts, and credentials are preserved.' \
            '' \
            'Native code display, copy controls, saved drafts, and safe submission recovery are included.' \
            'The installed coding/reconnect test uses a scripted provider and real sandboxed Cargo commands, not a live model.' \
            '' \
            'The attached installed-client images show that labeled test, not a personal-account session.' \
            'Linux hosts (x86_64, arm64): Plait-Host-*-linux-*.tar.gz, each with its own signed update-host-linux-*.json. See docs/REMOTE.md.' \
            'See docs/GUIDE.md, docs/REMOTE.md, and docs/VERIFICATION.md at this tag for setup and limits.' > notes.md
          # The tag is created with the release, on the commit this run built.
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease --draft \
            --title "Plait $RELEASE_TAG — local preview" --notes-file notes.md --generate-notes \
            release/*.dmg release/*.pkg release/*.zip release/*.tar.gz release/*.sha256 \
            release/update*.json release/update*.json.sig \
            release/install.sh release/release.json release/Plait-Release-*.json release/installed-client*.png
          gh release edit "$RELEASE_TAG" --draft=false
