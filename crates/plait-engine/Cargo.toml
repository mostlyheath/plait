[package]
name = "plait-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
plait-transport = { path = "../plait-transport" }
plait-release = { path = "../plait-release" }
plait-protocol = { path = "../plait-protocol" }
base64 = "=0.22.1"
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[dev-dependencies]
plait-client = { path = "../plait-client", features = ["test-host"] }
