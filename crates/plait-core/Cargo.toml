[package]
name = "plait-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
plait-engine = { path = "../plait-engine" }
plait-protocol = { path = "../plait-protocol" }
# Already pinned in the workspace graph; bounded image chunks use base64.
base64 = "=0.22.1"
# Verifies signed update manifests; signing happens only in the release workflow.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
libc = "=0.2.191"
pulldown-cmark = { version = "=0.13.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
unicode-properties = { version = "=0.1.3", default-features = false, features = ["general-category"] }
