[package]
name = "plait"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
plait-core = { path = "../plait-core" }
plait-protocol = { path = "../plait-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
unicode-segmentation = "=1.13.3"
# GPUI already pins this decoder; direct access supplies allocation limits and thumbnails.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

# Scene snapshots (see src/ui/snapshot.rs). GPUI's headless renderers draw the
# root view to PNG files without a window. `test-support` is a dev-dependency
# feature, so `cargo build` and release builds do not compile it.
[dev-dependencies]
# Already pinned by plait-core; builds tool arguments in README scenes.
serde_json = "=1.0.154"

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
# Core Text shaping, created off the main thread; the Mac platform cannot be.
gpui_apple = { workspace = true, features = ["font-kit", "test-support"] }

# Linux fonts and a software renderer. Not a macOS renderer check.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
gpui_wgpu = { workspace = true, features = ["test-support"] }
